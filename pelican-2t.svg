<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#558B2F"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="url(#sky)"/>

  <!-- Distant hills -->
  <path d="M0,260 Q100,220 200,250 Q300,230 400,255 Q450,245 500,250 L500,350 L0,350 Z" fill="#A5D6A7" opacity="0.6"/>

  <!-- Ground -->
  <path d="M0,270 Q250,260 500,270 L500,350 L0,350 Z" fill="url(#ground)"/>

  <!-- Road -->
  <path d="M0,290 Q250,280 500,290 L500,310 Q250,300 0,310 Z" fill="#78909C"/>
  <path d="M0,298 Q250,290 500,298" stroke="#FFF" stroke-width="2" stroke-dasharray="20,15" fill="none"/>

  <!-- Bicycle -->
  <g transform="translate(180, 180)">
    <!-- Rear wheel -->
    <g>
      <circle cx="0" cy="60" r="40" fill="none" stroke="#263238" stroke-width="4"/>
      <circle cx="0" cy="60" r="36" fill="none" stroke="#546E7A" stroke-width="1"/>
      <circle cx="0" cy="60" r="6" fill="#263238"/>
      <g stroke="#78909C" stroke-width="1.5">
        <line x1="0" y1="60" x2="0" y2="24"/>
        <line x1="0" y1="60" x2="31" y2="42"/>
        <line x1="0" y1="60" x2="36" y2="60"/>
        <line x1="0" y1="60" x2="31" y2="78"/>
        <line x1="0" y1="60" x2="0" y2="96"/>
        <line x1="0" y1="60" x2="-31" y2="78"/>
        <line x1="0" y1="60" x2="-36" y2="60"/>
        <line x1="0" y1="60" x2="-31" y2="42"/>
      </g>
    </g>

    <!-- Front wheel -->
    <g>
      <circle cx="120" cy="60" r="40" fill="none" stroke="#263238" stroke-width="4"/>
      <circle cx="120" cy="60" r="36" fill="none" stroke="#546E7A" stroke-width="1"/>
      <circle cx="120" cy="60" r="6" fill="#263238"/>
      <g stroke="#78909C" stroke-width="1.5">
        <line x1="120" y1="60" x2="120" y2="24"/>
        <line x1="120" y1="60" x2="151" y2="42"/>
        <line x1="120" y1="60" x2="156" y2="60"/>
        <line x1="120" y1="60" x2="151" y2="78"/>
        <line x1="120" y1="60" x2="120" y2="96"/>
        <line x1="120" y1="60" x2="89" y2="78"/>
        <line x1="120" y1="60" x2="84" y2="60"/>
        <line x1="120" y1="60" x2="89" y2="42"/>
      </g>
    </g>

    <!-- Frame -->
    <g stroke="#D32F2F" stroke-width="5" fill="none" stroke-linecap="round">
      <!-- Chainstay -->
      <path d="M0,60 L50,60"/>
      <!-- Seat tube -->
      <path d="M50,60 L50,20"/>
      <!-- Down tube -->
      <path d="M0,60 L90,50"/>
      <!-- Top tube -->
      <path d="M50,20 L90,25"/>
      <!-- Seat stay -->
      <path d="M50,20 L0,60"/>
      <!-- Head tube -->
      <path d="M90,25 L100,15"/>
      <!-- Fork -->
      <path d="M100,15 L120,60"/>
    </g>

    <!-- Handlebars -->
    <g stroke="#263238" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M100,15 L100,5"/>
      <path d="M88,5 L112,5"/>
      <path d="M88,5 L85,0"/>
      <path d="M112,5 L115,0"/>
    </g>

    <!-- Seat -->
    <path d="M40,18 Q50,12 60,18" stroke="#263238" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Crank and pedals -->
    <circle cx="50" cy="60" r="8" fill="#263238"/>
    <g stroke="#263238" stroke-width="3">
      <line x1="50" y1="60" x2="35" y2="75"/>
      <line x1="50" y1="60" x2="65" y2="45"/>
    </g>
    <rect x="28" y="73" width="14" height="5" rx="2" fill="#263238"/>
    <rect x="58" y="43" width="14" height="5" rx="2" fill="#263238"/>

    <!-- Chain -->
    <path d="M0,60 Q25,75 50,68" stroke="#546E7A" stroke-width="2" fill="none"/>
    <path d="M0,60 Q25,45 50,52" stroke="#546E7A" stroke-width="2" fill="none"/>
  </g>

  <!-- Pelican -->
  <g transform="translate(210, 90)">
    <!-- Tail feathers -->
    <path d="M-30,10 Q-50,5 -55,15 Q-45,20 -30,18" fill="#ECEFF1" stroke="#37474F" stroke-width="1.5"/>
    <path d="M-30,15 Q-48,15 -52,22 Q-42,25 -30,22" fill="#ECEFF1" stroke="#37474F" stroke-width="1.5"/>

    <!-- Body -->
    <ellipse cx="0" cy="10" rx="40" ry="28" fill="#FAFAFA" stroke="#37474F" stroke-width="2"/>

    <!-- Wing (far side, darker) -->
    <path d="M-15,5 Q-35,-10 -40,10 Q-30,20 -15,15" fill="#CFD8DC" stroke="#37474F" stroke-width="1.5"/>

    <!-- Wing (near side) -->
    <path d="M-10,0 Q-35,-15 -42,10 Q-32,25 -10,18" fill="#ECEFF1" stroke="#37474F" stroke-width="2"/>
    <path d="M-15,5 Q-28,-5 -35,8" stroke="#90A4AE" stroke-width="1" fill="none"/>
    <path d="M-15,10 Q-28,5 -35,15" stroke="#90A4AE" stroke-width="1" fill="none"/>

    <!-- Neck -->
    <path d="M30,0 Q45,-25 50,-45 Q52,-52 45,-58" stroke="#FAFAFA" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M30,0 Q45,-25 50,-45 Q52,-52 45,-58" stroke="#37474F" stroke-width="1" fill="none"/>

    <!-- Head -->
    <ellipse cx="45" cy="-62" rx="16" ry="13" fill="#FAFAFA" stroke="#37474F" stroke-width="2"/>

    <!-- Crest feathers -->
    <path d="M35,-72 Q30,-80 25,-78" stroke="#37474F" stroke-width="1.5" fill="none"/>
    <path d="M38,-74 Q35,-82 30,-80" stroke="#37474F" stroke-width="1.5" fill="none"/>

    <!-- Upper beak -->
    <path d="M58,-65 Q85,-60 95,-52 Q90,-48 60,-55" fill="#FFA726" stroke="#37474F" stroke-width="1.5"/>
    <!-- Lower beak with pouch -->
    <path d="M58,-58 Q80,-40 60,-32 Q68,-45 58,-58" fill="#FFB74D" stroke="#37474F" stroke-width="1.5"/>
    <!-- Pouch detail -->
    <path d="M62,-52 Q75,-42 62,-36" stroke="#FFA726" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Eye -->
    <circle cx="40" cy="-65" r="3.5" fill="#263238"/>
    <circle cx="41" cy="-66" r="1.2" fill="white"/>

    <!-- Legs -->
    <g stroke="#FFA726" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M-5,35 L-15,70 L-25,78"/>
      <path d="M8,35 L18,70 L28,78"/>
    </g>

    <!-- Webbed feet on pedals -->
    <path d="M-25,78 L-32,82 L-18,82 Z" fill="#FFA726" stroke="#37474F" stroke-width="1"/>
    <path d="M28,78 L21,82 L35,82 Z" fill="#FFA726" stroke="#37474F" stroke-width="1"/>
  </g>

  <!-- Pelican helmet -->
  <g transform="translate(248, 22)">
    <path d="M-18,0 Q-20,-20 0,-22 Q20,-20 18,0 Q15,8 0,10 Q-15,8 -18,0" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
    <path d="M-18,0 Q0,5 18,0" stroke="#0D47A1" stroke-width="2" fill="none"/>
    <circle cx="0" cy="-12" r="3" fill="#64B5F6" opacity="0.5"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#B0BEC5" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="200" x2="155" y2="198"/>
    <line x1="115" y1="220" x2="150" y2="218"/>
    <line x1="125" y1="240" x2="160" y2="238"/>
    <line x1="130" y1="260" x2="165" y2="258"/>
  </g>

  <!-- Birds in sky -->
  <g stroke="#37474F" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M380,60 Q385,55 390,60 Q395,55 400,60"/>
    <path d="M420,80 Q424,76 428,80 Q432,76 436,80"/>
    <path d="M350,100 Q353,97 356,100 Q359,97 362,100"/>
  </g>

  <!-- Sun -->
  <g>
    <circle cx="440" cy="55" r="28" fill="#FFEB3B"/>
    <g stroke="#FDD835" stroke-width="3" stroke-linecap="round">
      <line x1="440" y1="18" x2="440" y2="8"/>
      <line x1="477" y1="55" x2="487" y2="55"/>
      <line x1="440" y1="92" x2="440" y2="102"/>
      <line x1="403" y1="55" x2="393" y2="55"/>
      <line x1="414" y1="29" x2="407" y2="22"/>
      <line x1="466" y1="81" x2="473" y2="88"/>
      <line x1="414" y1="81" x2="407" y2="88"/>
      <line x1="466" y1="29" x2="473" y2="22"/>
    </g>
  </g>

  <!-- Clouds -->
  <g fill="white" opacity="0.85">
    <ellipse cx="100" cy="50" rx="25" ry="15"/>
    <ellipse cx="120" cy="45" rx="30" ry="18"/>
    <ellipse cx="145" cy="52" rx="22" ry="13"/>
    <ellipse cx="300" cy="70" rx="20" ry="12"/>
    <ellipse cx="318" cy="66" rx="25" ry="14"/>
    <ellipse cx="340" cy="72" rx="18" ry="11"/>
  </g>

  <!-- Flowers -->
  <g>
    <circle cx="60" cy="320" r="4" fill="#E91E63"/>
    <circle cx="60" cy="320" r="1.5" fill="#FFEB3B"/>
    <circle cx="420" cy="325" r="4" fill="#9C27B0"/>
    <circle cx="420" cy="325" r="1.5" fill="#FFEB3B"/>
    <circle cx="350" cy="330" r="4" fill="#E91E63"/>
    <circle cx="350" cy="330" r="1.5" fill="#FFEB3B"/>
  </g>

  <!-- Grass blades -->
  <g stroke="#558B2F" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M40,330 Q43,318 38,312"/>
    <path d="M48,332 Q52,320 47,314"/>
    <path d="M440,335 Q443,323 438,317"/>
    <path d="M448,337 Q452,325 447,319"/>
    <path d="M300,338 Q303,326 298,320"/>
  </g>
</svg>
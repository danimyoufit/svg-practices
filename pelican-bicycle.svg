<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#e8f4fd"/>
  
  <!-- Ground -->
  <path d="M0,240 Q200,230 400,240 L400,300 L0,300 Z" fill="#8fc63e"/>
  
  <!-- Bicycle frame -->
  <g stroke="#333" stroke-width="3" fill="none">
    <!-- Main triangle -->
    <path d="M150,200 L200,150 L250,200 L150,200"/>
    <!-- Seat tube -->
    <path d="M200,150 L200,120"/>
    <!-- Top tube -->
    <path d="M200,150 L230,140"/>
    <!-- Down tube -->
    <path d="M150,200 L230,185"/>
    <!-- Chainstays -->
    <path d="M150,200 L100,220"/>
    <path d="M150,200 L110,225"/>
    <!-- Seatstays -->
    <path d="M200,120 L160,200"/>
    <path d="M200,120 L170,205"/>
    <!-- Fork -->
    <path d="M230,185 L250,160 L270,185"/>
    <path d="M250,160 L250,140"/>
    <!-- Handlebars -->
    <path d="M240,140 L260,140"/>
    <path d="M240,140 L235,130"/>
    <path d="M260,140 L265,130"/>
  </g>
  
  <!-- Wheels -->
  <g stroke="#333" stroke-width="3" fill="none">
    <!-- Rear wheel -->
    <circle cx="150" cy="220" r="30"/>
    <circle cx="150" cy="220" r="8" fill="#333"/>
    <!-- Spokes rear -->
    <g stroke="#666" stroke-width="1">
      <line x1="150" y1="220" x2="150" y2="190"/>
      <line x1="150" y1="220" x2="176" y2="204"/>
      <line x1="150" y1="220" x2="180" y2="220"/>
      <line x1="150" y1="220" x2="176" y2="236"/>
      <line x1="150" y1="220" x2="150" y2="250"/>
      <line x1="150" y1="220" x2="124" y2="236"/>
      <line x1="150" y1="220" x2="120" y2="220"/>
      <line x1="150" y1="220" x2="124" y2="204"/>
    </g>
    
    <!-- Front wheel -->
    <circle cx="270" cy="185" r="30"/>
    <circle cx="270" cy="185" r="8" fill="#333"/>
    <!-- Spokes front -->
    <g stroke="#666" stroke-width="1">
      <line x1="270" y1="185" x2="270" y2="155"/>
      <line x1="270" y1="185" x2="296" y2="169"/>
      <line x1="270" y1="185" x2="300" y2="185"/>
      <line x1="270" y1="185" x2="296" y2="201"/>
      <line x1="270" y1="185" x2="270" y2="215"/>
      <line x1="270" y1="185" x2="244" y2="201"/>
      <line x1="270" y1="185" x2="240" y2="185"/>
      <line x1="270" y1="185" x2="244" y2="169"/>
    </g>
  </g>
  
  <!-- Pedals -->
  <g stroke="#333" stroke-width="3">
    <line x1="135" y1="210" x2="120" y2="205"/>
    <line x1="165" y1="230" x2="180" y2="235"/>
  </g>
  
  <!-- Seat -->
  <path d="M195,115 Q200,110 215,115" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Pelican body -->
  <g transform="translate(170, 80)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="white" stroke="#333" stroke-width="2"/>
    <!-- Wing -->
    <path d="M-10,-5 Q-30,-20 -35,5 Q-25,15 -10,5" fill="white" stroke="#333" stroke-width="2"/>
    <!-- Wing feathers -->
    <path d="M-15,0 Q-25,-8 -30,2" stroke="#333" stroke-width="1" fill="none"/>
    <path d="M-15,5 Q-25,0 -30,10" stroke="#333" stroke-width="1" fill="none"/>
    
    <!-- Neck -->
    <path d="M25,-5 Q35,-25 40,-35 Q42,-40 35,-45" stroke="white" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M25,-5 Q35,-25 40,-35 Q42,-40 35,-45" stroke="#333" stroke-width="1" fill="none"/>
    
    <!-- Head -->
    <ellipse cx="35" cy="-50" rx="15" ry="12" fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Beak (pelican's distinctive large beak) -->
    <path d="M48,-50 Q70,-45 75,-40 Q72,-38 50,-42" fill="#ff6b35" stroke="#333" stroke-width="1"/>
    <!-- Lower beak/pouch -->
    <path d="M48,-45 Q65,-30 50,-25 Q55,-35 48,-45" fill="#ff8c42" stroke="#333" stroke-width="1" opacity="0.8"/>
    
    <!-- Eye -->
    <circle cx="30" cy="-52" r="3" fill="#333"/>
    <circle cx="31" cy="-53" r="1" fill="white"/>
    
    <!-- Legs (on pedals) -->
    <g stroke="#ff6b35" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M-5,20 L-10,40 L-15,45"/>
      <path d="M5,20 L10,40 L15,45"/>
    </g>
    
    <!-- Feet on pedals -->
    <g fill="#ff6b35">
      <path d="M-15,45 L-20,48 L-10,48 Z"/>
      <path d="M15,45 L10,48 L20,48 Z"/>
    </g>
  </g>
  
  <!-- Helmet on pelican -->
  <g transform="translate(205, 30)">
    <path d="M0,0 Q20,-15 40,0 Q45,-5 45,10 Q45,25 20,30 Q-5,25 -5,10 Q-5,-5 0,0" fill="#e74c3c" stroke="#333" stroke-width="1"/>
    <ellipse cx="20" cy="8" rx="15" ry="6" fill="#c0392b" opacity="0.3"/>
  </g>
  
  <!-- Motion lines -->
  <g stroke="#666" stroke-width="1.5" opacity="0.6">
    <line x1="80" y1="220" x2="100" y2="218"/>
    <line x1="80" y1="235" x2="100" y2="233"/>
    <line x1="80" y1="205" x2="100" y2="207"/>
    <line x1="200" y1="185" x2="220" y2="183"/>
    <line x1="200" y1="200" x2="220" y2="198"/>
    <line x1="200" y1="170" x2="220" y2="172"/>
  </g>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="30" fill="#ffd700" opacity="0.9"/>
  <g stroke="#ffd700" stroke-width="2">
    <line x1="350" y1="15" x2="350" y2="5"/>
    <line x1="385" y1="50" x2="395" y2="50"/>
    <line x1="350" y1="85" x2="350" y2="95"/>
    <line x1="315" y1="50" x2="305" y2="50"/>
    <line x1="330" y1="30" x2="322" y2="22"/>
    <line x1="370" y1="70" x2="378" y2="78"/>
    <line x1="330" y1="70" x2="322" y2="78"/>
    <line x1="370" y1="30" x2="378" y2="22"/>
  </g>
  
  <!-- Clouds -->
  <g fill="white" opacity="0.9">
    <circle cx="80" cy="60" r="15"/>
    <circle cx="100" cy="55" r="20"/>
    <circle cx="120" cy="60" r="15"/>
    <circle cx="300" cy="80" r="12"/>
    <circle cx="318" cy="75" r="18"/>
    <circle cx="335" cy="80" r="12"/>
  </g>
  
  <!-- Grass tufts -->
  <g stroke="#6ab04c" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M30,245 Q35,230 30,225"/>
    <path d="M60,248 Q65,233 60,228"/>
    <path d="M350,242 Q355,227 350,222"/>
    <path d="M380,246 Q385,231 380,226"/>
  </g>
</svg>